/* =====================================================================
   ضغط ورفع الصور إلى Supabase Storage
===================================================================== */
function compressImageToBlob(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1000;
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.72);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadImageFile(file, folder){
  const blob = await compressImageToBlob(file);
  const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
  const { error } = await sb.storage.from('submission-images').upload(path, blob, { contentType: 'image/jpeg' });
  if(error) throw error;
  const { data } = sb.storage.from('submission-images').getPublicUrl(path);
  return data.publicUrl;
}

function fieldLabel(text, required){ return `<label class="block text-sm font-medium mb-2 text-textSecondary">${text}${required ? ' <span class="text-textPrimary">*</span>' : ''}</label>`; }
function textInput(id, placeholder, value, type){ return `<input id="${id}" type="${type||'text'}" value="${value ? String(value).replace(/"/g,'&quot;') : ''}" placeholder="${placeholder||''}" class="input-field bg-bgInput border border-borderGray text-textPrimary w-full rounded-lg p-3">`; }
function textArea(id, value, rows){ return `<textarea id="${id}" rows="${rows||2}" class="input-field bg-bgInput border border-borderGray text-textPrimary w-full rounded-lg p-3">${value?String(value).replace(/</g,'&lt;'):''}</textarea>`; }
function readOnlyField(value){ return `<div class="bg-bgInput/60 border border-borderGray text-textSecondary w-full rounded-lg p-3">${value}</div>`; }
function selectField(id, options, value){
  let opts = `<option value="">اختر...</option>`;
  options.forEach(o=>{ opts += `<option value="${o}" ${o===value?'selected':''}>${o}</option>`; });
  return `<select id="${id}" class="input-field bg-bgInput border border-borderGray text-textPrimary w-full rounded-lg p-3 cursor-pointer">${opts}</select>`;
}
function pillGroup(name, options, selectedValues){
  return `<div class="flex flex-wrap gap-3" data-group="${name}">` + options.map(o=>{
    const checked = (selectedValues||[]).includes(o);
    return `<label class="opt-btn cursor-pointer">
      <input type="checkbox" class="hidden" data-name="${name}" value="${o}" ${checked?'checked':''} onchange="onPillChange(event)">
      <div class="border border-borderGray rounded-full px-5 py-2 text-sm text-textSecondary">${o}</div>
    </label>`;
  }).join('') + `</div>`;
}
function radioPillGroup(name, options, value){
  return `<div class="flex flex-wrap gap-3" data-group="${name}">` + options.map(o=>{
    const checked = value === o;
    return `<label class="opt-btn cursor-pointer">
      <input type="radio" name="${name}" class="hidden" value="${o}" ${checked?'checked':''} onchange="onRadioChange('${name}','${o}')">
      <div class="border border-borderGray rounded-full px-5 py-2 text-sm text-textSecondary">${o}</div>
    </label>`;
  }).join('') + `</div>`;
}
function sectionCard(title, imgB64, imgAlt, innerHtml){
  return `
  <section class="mb-8 border-b border-borderGray pb-8">
    <h3 class="text-lg font-bold text-textPrimary mb-4">${title}</h3>
    ${imgB64 ? `
    <div class="mb-6 bg-bgInput/60 p-4 rounded-xl border border-borderGray text-center">
      <img src="${imgB64}" alt="${imgAlt}" class="mx-auto max-h-72 rounded-lg object-contain">
    </div>` : ''}
    ${innerHtml}
  </section>`;
}
function imagesUploader(sectionKey){
  const imgs = getSectionImages(sectionKey);
  const thumbs = imgs.map((src,i)=>`
    <div class="relative">
      <img src="${src}" class="thumb">
      <button onclick="removeImage('${sectionKey}',${i})" class="absolute -top-2 -left-2 bg-bgInput2 border border-borderLight text-textPrimary w-6 h-6 rounded-full text-xs font-bold">×</button>
    </div>`).join('');
  return `
  <div class="bg-bgInput/60 p-4 rounded-xl border border-borderGray">
    <div class="flex flex-wrap gap-3 mb-3">${thumbs || '<p class="text-xs text-textMuted">لا توجد صور مرفقة بعد</p>'}</div>
    <input type="file" multiple accept="image/*" onchange="onImagesSelected(event,'${sectionKey}')" class="text-xs text-textSecondary file:ml-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-btnGray file:text-white hover:file:bg-btnHover w-full cursor-pointer">
    <p class="text-[11px] text-textMuted mt-2">يمكن اختيار أكثر من صورة دفعة واحدة</p>
  </div>`;
}
function getSectionImages(sectionKey){
  const s = STATE.activeSubmission;
  if(sectionKey==='robe') return s.robe.images;
  if(sectionKey==='cap') return s.cap.images;
  if(sectionKey==='scarf') return s.scarf.images;
  return s.general.images;
}
async function onImagesSelected(ev, sectionKey){
  const files = Array.from(ev.target.files || []);
  if(!files.length) return;
  collectFormValues();
  toast('جاري رفع الصور...', 4000);
  for(const f of files){
    try{
      const url = await uploadImageFile(f, sectionKey);
      getSectionImages(sectionKey).push(url);
    }catch(e){ console.error(e); toast('تعذّر رفع إحدى الصور'); }
  }
  toast('تم رفع الصور ✓');
  STATE.activeRerender && STATE.activeRerender();
}
function removeImage(sectionKey, idx){
  collectFormValues();
  getSectionImages(sectionKey).splice(idx,1);
  STATE.activeRerender && STATE.activeRerender();
}
function onPillChange(ev){
  const name = ev.target.dataset.name;
  const val = ev.target.value;
  if(name === 'pieces'){
    const s = STATE.activeSubmission;
    if(ev.target.checked){ if(!s.pieces.includes(val)) s.pieces.push(val); }
    else { s.pieces = s.pieces.filter(p=>p!==val); }
  }
}
function onRadioChange(name, val){

  if(name==='robeFrame') s.robe.frameInSleeve = val;
}
function collectFormValues(){

  if(g('r_notes')) s.robe.notes = g('r_notes').value;
  if(g('c_collar')) s.cap.collarType = g('c_collar').value;

  if(g('c_head')) s.cap.headSize = g('c_head').value;
  if(g('c_notes')) s.cap.notes = g('c_notes').value;

  if(g('gen_notes')) s.general.notes = g('gen_notes').value;

  try{
    STATE.user = { name, role: 'member' };
    STATE.view = 'form';
    const { data, error } = await sb.from('submissions').select('*').eq('student_name', name).limit(1);

    if(data && data.length){

  const email = document.getElementById('admin_email').value.trim();
  const pass = document.getElementById('admin_pass').value;
  if(!email || !pass){ toast('أدخل البريد وكلمة المرور'); return; }
  const btn = document.getElementById('adminLoginBtn');
  btn.innerHTML = '<span class="spinner"></span>';
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ toast('بيانات الدخول غير صحيحة'); btn.innerHTML='دخول'; return; }
    STATE.authUser = data.user;
    const { data: profile, error: pErr } = await sb.from('profiles').select('*').eq('auth_user_id', data.user.id).limit(1);
    if(pErr || !profile || !profile.length){
      toast('حسابك غير مرتبط بأي صلاحية بالنظام');
      await sb.auth.signOut();
      btn.innerHTML='دخول';
      return;
    }
    STATE.user = { name: profile[0].full_name, role: profile[0].role };
    STATE.view = 'admin';
    toast('مرحباً ' + STATE.user.name);
    await loadAdminData();
    renderAdmin();
  }catch(e){
    console.error(e);
    toast('صار خطأ، حاول مرة أخرى');
    btn.innerHTML = 'دخول';
  }
}

function openConfirm(){
  collectFormValues();
  if(!STATE.submission.student_name){ toast('الرجاء إدخال الاسم الثلاثي'); return; }
  if(STATE.submission.pieces.length === 0){ toast('فضلاً اختر قطعة واحدة على الأقل'); return; }

  const modal = document.createElement('div');
  modal.id = 'confirmModal';
  modal.className = 'fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4';
  modal.innerHTML = `
    <div class="bg-bgCard border border-borderGray rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl fade-in">
      <h3 class="text-lg font-bold mb-2">تأكيد الإرسال</h3>
      <p class="text-sm text-textSecondary mb-6">هل أنت متأكد من صحة جميع التفاصيل قبل إرسال الطلب؟</p>
      <div class="flex gap-3">
        <button onclick="document.getElementById('confirmModal').remove()" class="flex-1 border border-borderGray rounded-lg py-2.5 text-sm font-bold text-textSecondary">رجوع</button>
        <button id="confirmSendBtn" onclick="submitForm()" class="flex-1 bg-btnGray hover:bg-btnHover rounded-lg py-2.5 text-sm font-bold text-white">نعم، إرسال</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function submitForm(){
  const btn = document.getElementById('confirmSendBtn');
  btn.innerHTML = '<span class="spinner"></span>';
  try{
    STATE.submission.status = 'submitted';
    STATE.submission.scarf.color = SCARF_FIXED_COLOR;
    if(STATE.submissionId){
      const { error } = await sb.from('submissions').update(STATE.submission).eq('id', STATE.submissionId);
      if(error) throw error;
      await logActivity('update', STATE.submission.student_name, {});
    } else {
      const { data, error } = await sb.from('submissions').insert(STATE.submission).select().limit(1);
      if(error) throw error;
      STATE.submissionId = data[0].id;
      await logActivity('create', STATE.submission.student_name, {});
    }
    document.getElementById('confirmModal')?.remove();
    STATE.submittedOnce = true;
    STATE.editingUnlocked = false;
    toast('تم استلام طلبك بنجاح ✓');
    renderForm();
  }catch(e){
    console.error(e);
    toast('صار خطأ أثناء الإرسال، حاول مرة أخرى');
    btn.innerHTML = 'نعم، إرسال';
  }
}

async function loadAdminData(){
  const [{ data: subs }, { data: assistants }, { data: logs }] = await Promise.all([
    sb.from('submissions').select('*').order('updated_at', { ascending:false }),
    sb.from('profiles').select('*').eq('role','assistant').order('created_at', { ascending:false }),
    sb.from('activity_logs').select('*').order('created_at', { ascending:false }).limit(200)
  ]);
  STATE.adminList = subs || [];
  STATE.assistants = assistants || [];
  STATE.logs = logs || [];
}

function computeStats(){
  const list = STATE.adminList;
  const total = list.length;
  const pieceCounts = {};
  const modelCounts = {};
  list.forEach(s=>{
    (s.pieces||[]).forEach(p=> pieceCounts[p] = (pieceCounts[p]||0)+1);
    const m = s.robe && s.robe.model;
    if(m) modelCounts[m] = (modelCounts[m]||0)+1;
  });
  return { total, pieceCounts, modelCounts };
}

function roleLabel(r){ if(r==='leader') return 'القائد'; if(r==='assistant') return 'قائد مساعد'; return 'عضو'; }

async function addAssistant(){
  const name = normalizeName(document.getElementById('new_asst_name').value);
  const uid = document.getElementById('new_asst_uid').value.trim();
  if(!name || !uid){ toast('اكتب الاسم والـ UID'); return; }
  try{
    const { error } = await sb.from('profiles').insert({ auth_user_id: uid, full_name: name, role: 'assistant' });
    if(error) throw error;
    toast('تم تعيين ' + name + ' كقائد مساعد');
    await loadAdminData();
    renderAdmin();
  }catch(e){
    console.error(e);
    toast('تعذّر التعيين — تأكد إن الـ UID صحيح وغير مستخدم من قبل');
  }
}

async function removeAssistant(profileId){
  if(!confirm('هل تريد إلغاء صلاحية هذا القائد المساعد؟')) return;
  try{
    const { error } = await sb.from('profiles').delete().eq('id', profileId);
    if(error) throw error;
    toast('تم إلغاء الصلاحية');
    await loadAdminData();
    renderAdmin();
  }catch(e){ console.error(e); toast('تعذّر الإلغاء'); }
}

async function deleteSubmission(i){
  const item = STATE.adminList[i];
  if(!confirm('هل تريد حذف طلب ' + (item.student_name || 'هذا الطالب') + '؟')) return;
  try{
    const { error } = await sb.from('submissions').delete().eq('id', item.id);
    if(error) throw error;
    await logActivity('delete', item.student_name, {});
    toast('تم حذف الطلب');
    await loadAdminData();
    renderAdmin();
  }catch(e){ console.error(e); toast('تعذّر الحذف'); }
}

async function saveAdminEdit(){
  collectFormValues();
  const s = STATE.activeSubmission;
  if(!s.student_name){ toast('الرجاء إدخال الاسم الثلاثي'); return; }
  try{
    s.scarf.color = SCARF_FIXED_COLOR;
    const payload = { student_name: s.student_name, pieces: s.pieces, robe: s.robe, cap: s.cap, scarf: s.scarf, general: s.general, status: s.status };
    const { error } = await sb.from('submissions').update(payload).eq('id', STATE.editingId);
    if(error) throw error;
    await logActivity('update', s.student_name, {});
    toast('تم حفظ التعديلات');
    closeDetail();
    await loadAdminData();
    renderAdmin();
  }catch(e){ console.error(e); toast('تعذّر الحفظ'); }
}

async function deleteFromModal(){
  const s = STATE.activeSubmission;
  if(!confirm('هل تريد حذف طلب ' + (s.student_name || 'هذا الطالب') + '؟')) return;
  try{
    const { error } = await sb.from('submissions').delete().eq('id', STATE.editingId);
    if(error) throw error;
    await logActivity('delete', s.student_name, {});
    toast('تم حذف الطلب');
    closeDetail();
    await loadAdminData();
    renderAdmin();
  }catch(e){ console.error(e); toast('تعذّر الحذف'); }
}
